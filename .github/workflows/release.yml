name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Require signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to assemble an unsigned APK."
            exit 1
          fi

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) VERSION_NAME="${TAG#v}" ;;
            *) echo "::error::Tag '${TAG}' must start with v"; exit 1 ;;
          esac
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Empty versionName derived from tag"
            exit 1
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quicklogger-release.jks"

      - name: Assemble signed release APK
        env:
          QUICKLOGGER_STORE_FILE: ${{ runner.temp }}/quicklogger-release.jks
          QUICKLOGGER_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          QUICKLOGGER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          QUICKLOGGER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "app/build/outputs/apk/release/app-release.apk#quicklogger-${VERSION_NAME}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "QuickLogger ${VERSION_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Forget keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/quicklogger-release.jks"
